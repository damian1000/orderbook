# JitPack runs Gradle on openjdk21 (its default JDK 8 is too old, and it has no JDK 25). The build
# compiles against a JDK 25 toolchain, so we download JDK 25 here and point Gradle at it, instead of
# relying on the Foojay resolver plugin: Foojay is published only to the Gradle Plugin Portal (not
# Maven Central), and JitPack's fetch of it fails intermittently, breaking tag builds. Provisioning
# the JDK directly removes that single point of failure. CI (actions/setup-java) and local dev run
# Gradle on JDK 25 already, so the toolchain is satisfied by the running JVM there — no download.
jdk:
  - openjdk21
before_install:
  - curl -sSL "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jdk/hotspot/normal/eclipse" -o /tmp/jdk25.tar.gz
  - mkdir -p /tmp/jdk25 && tar -xzf /tmp/jdk25.tar.gz -C /tmp/jdk25 --strip-components=1
  - printf '\norg.gradle.java.installations.paths=/tmp/jdk25\n' >> gradle.properties
install:
  # JitPack's builder intermittently fails to resolve services.gradle.org, which the Gradle
  # wrapper contacts to download its pinned distribution. Retry the whole invocation a bounded
  # number of times rather than dropping the wrapper: the pinned version is what CI and local
  # dev build with, and JitPack caches a failed build against the tag permanently.
  - n=1; until ./gradlew --no-daemon :core:publishToMavenLocal; do n=$((n+1)); if [ "$n" -gt 4 ]; then echo "gradle failed after 4 attempts"; exit 1; fi; echo "retrying, attempt $n"; sleep 20; done
